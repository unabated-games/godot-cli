<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="{{ base_url }}/assets/style.css">
<link rel="stylesheet" href="{{ base_url }}/assets/highlight.css">
<link rel="icon" href="{{ base_url }}/assets/favicon.svg" type="image/svg+xml">
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      if (stored) document.documentElement.setAttribute("data-theme", stored);
    } catch (e) {}
  })();
</script>
</head>
<body class="landing">
<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <a class="brand" href="{{ base_url }}/">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="7" fill="#478cbf"/><path d="M7 11l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 21h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
    godot-cli
  </a>
  <nav class="header-nav">
    <a href="{{ base_url }}/getting-started/">Getting started</a>
    <a href="{{ base_url }}/how-to/">How-to</a>
    <a href="{{ base_url }}/reference/">Reference</a>
    <a href="https://github.com/unabated-games/godot-cli">GitHub</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme"><svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<main id="content" class="landing-content">
  {{ content }}
</main>
<footer class="site-footer">
  <p>godot-cli is MIT licensed, from <a href="https://github.com/unabated-games">Unabated Games</a>. Godot and the Godot Engine logo are trademarks of the Godot Foundation; this project is not affiliated with the Godot Foundation or the Godot Engine project.</p>
</footer>
<script src="{{ base_url }}/assets/site.js"></script>
</body>
</html>
