name: Release

# Cut a release with `git tag v0.2.0 && git push origin v0.2.0`.
# See RELEASING.md for the full checklist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v), e.g. 0.2.0"
        required: true

permissions:
  contents: write
  # Build provenance for the published archives.
  id-token: write
  attestations: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast \
            -Dversion-string=${{ steps.version.outputs.version }} \
            --prefix out

      # The archive mirrors the repository layout, so install.sh stages from an
      # unpacked release and from a checkout with the same relative paths.
      - name: Package
        id: package
        run: |
          name="godot-cli-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name/docs" "dist/$name/share"
          cp -R out/bin "dist/$name/bin"
          cp -R templates "dist/$name/templates"
          cp docs/agent_quickstart.md docs/agent_scene_authoring.md \
             docs/agent_batch_commands.md docs/commands.md docs/mcp_tools.json \
             "dist/$name/docs/"
          cp -R share/examples "dist/$name/share/examples"
          cp -R share/completions "dist/$name/share/completions"
          cp -R share/man "dist/$name/share/man"
          cp -R skills "dist/$name/skills"
          cp -R third_party "dist/$name/third_party"
          cp README.md CHANGELOG.md LICENSE THIRDPARTY.md install.sh "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows)
              zip -qr "$name.zip" "$name"
              echo "artifact=dist/$name.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              tar -czf "$name.tar.gz" "$name"
              echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-cli-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Release notes come from the CHANGELOG section that was reviewed with the
      # change, not from a generated list of commit subjects.
      - name: Compose release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            bash tools/changelog_section.sh "$version"
            cat <<EOF

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          Installs to \`~/.godot-cli\` (binary, scene templates, agent docs, examples,
          shell completions, man page). Then:

          \`\`\`bash
          source "\$HOME/.godot-cli/env.sh"
          godot-cli --version
          \`\`\`

          Or download an archive below and run \`bin/godot-cli\` from it.

          ## Verify

          \`\`\`bash
          shasum -a 256 -c SHA256SUMS --ignore-missing
          gh attestation verify godot-cli-$version-<target>.tar.gz --repo ${{ github.repository }}
          \`\`\`
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        # Attestations need a public repository (or GitHub Advanced Security);
        # a missing attestation should not block the release itself.
        continue-on-error: true
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          fail_on_unmatched_files: true
