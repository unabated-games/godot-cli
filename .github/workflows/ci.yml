name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Run tests
        run: zig build test

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Guards against host-only APIs (e.g. std.c.getenv without libc) creeping
      # back in and silently breaking every non-macOS user.
      - name: Build for every supported target
        run: |
          for target in \
            x86_64-linux-gnu \
            x86_64-linux-musl \
            aarch64-linux-gnu \
            aarch64-linux-musl \
            x86_64-macos \
            aarch64-macos \
            x86_64-windows \
            aarch64-windows
          do
            echo "::group::$target"
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe
            echo "::endgroup::"
          done

  generated:
    name: generated docs and completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install shells and man tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish mandoc shellcheck

      # The command reference, man page, and completions are generated from the
      # CommandSpec tree; this fails if a command was added without running
      # `zig build docs`.
      - name: Check generated files are current
        run: zig build docs-check

      - name: Lint the man page
        run: mandoc -Tlint -Wwarning share/man/man1/godot-cli.1

      - name: Check completions parse in every shell
        run: |
          bash -n share/completions/godot-cli.bash
          zsh -n share/completions/_godot-cli
          fish --no-execute share/completions/godot-cli.fish

      - name: Shellcheck the installer
        run: shellcheck install.sh tools/*.sh

      - name: Test the installer's release resolution
        run: tools/test_install_sh.sh

      # The agent-facing tool catalog is hand-written; this checks only that it
      # covers every runnable command.
      - name: Check the MCP tool catalog covers every command
        run: |
          zig build
          tools/check_mcp_tools.sh

  test-godot:
    name: godot round-trip
    # Downloads the Godot editor, so keep it off every PR push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7"
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          asset="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${asset}.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d godot-bin
          chmod +x "godot-bin/${asset}"

      - name: Run Godot round-trip tests
        run: |
          asset="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          zig build test-godot -Dgodot="$PWD/godot-bin/${asset}"
